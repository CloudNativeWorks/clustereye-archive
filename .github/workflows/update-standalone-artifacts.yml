name: Update Standalone Artifacts (API + UI)

# Mirrors the standalone API binary and UI tarball from the PRIVATE source repos
# (clustereye-api, clustereye) into this PUBLIC archive's downloads/, so that
# archive.clustereye.com can serve them to anonymous installers.
#
# Requires repo secret ARCHIVE_SYNC_TOKEN: a fine-grained PAT with
# "Contents: read" on CloudNativeWorks/clustereye-api and CloudNativeWorks/clustereye.

on:
  workflow_dispatch:
    inputs:
      api_version:
        description: 'API version to mirror (e.g., 1.1.254) — leave empty to skip'
        required: false
        type: string
      ui_version:
        description: 'UI version to mirror (e.g., 1.3.77) — leave empty to skip'
        required: false
        type: string

# Share the archive-push concurrency group so simultaneous archive workflows
# don't race on main (mirrors update-agent-binaries.yml).
concurrency:
  group: clustereye-archive-push
  cancel-in-progress: false

jobs:
  mirror-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ github.event.inputs.api_version }}" ] && [ -z "${{ github.event.inputs.ui_version }}" ]; then
            echo "::error::Provide at least one of api_version / ui_version"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Mirror API binary
        if: github.event.inputs.api_version != ''
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_SYNC_TOKEN }}
        run: |
          VER="${{ github.event.inputs.api_version }}"
          VER="${VER#v}"   # normalize: strip a leading 'v' if present
          DEST="downloads/api/v${VER}"
          mkdir -p "$DEST"

          echo "Downloading clustereye-api v${VER} from clustereye-api releases..."
          gh release download "v${VER}" \
            --repo CloudNativeWorks/clustereye-api \
            --pattern clustereye-api \
            --dir "$DEST" --clobber

          ( cd "$DEST" && sha256sum clustereye-api > clustereye-api.sha256 )
          echo "Mirrored:"
          ls -la "$DEST"

      - name: Mirror UI tarball
        if: github.event.inputs.ui_version != ''
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_SYNC_TOKEN }}
        run: |
          VER="${{ github.event.inputs.ui_version }}"
          VER="${VER#v}"
          DEST="downloads/ui/v${VER}"
          mkdir -p "$DEST"

          echo "Downloading clustereye.tar.gz v${VER} from clustereye (frontend) releases..."
          gh release download "v${VER}" \
            --repo CloudNativeWorks/clustereye \
            --pattern clustereye.tar.gz \
            --dir "$DEST" --clobber

          ( cd "$DEST" && sha256sum clustereye.tar.gz > clustereye.tar.gz.sha256 )
          echo "Mirrored:"
          ls -la "$DEST"

      - name: Prune old versions (keep Pages artifact under 1GB)
        run: bash scripts/prune-old-versions.sh 3

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for d in downloads/api downloads/ui; do
            [ -d "$d" ] && git add "$d"
          done
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          MSG="Mirror standalone artifacts"
          [ -n "${{ github.event.inputs.api_version }}" ] && MSG="$MSG api=v${{ github.event.inputs.api_version }}"
          [ -n "${{ github.event.inputs.ui_version }}" ] && MSG="$MSG ui=v${{ github.event.inputs.ui_version }}"
          git commit -m "$MSG"

          # Rebase before push — a concurrent workflow may have moved main
          # (guards against non-fast-forward rejection).
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed (remote changed), retrying in 5s..."
            sleep 5
          done
          echo "Push failed after 5 attempts"
          exit 1
