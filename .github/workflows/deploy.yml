# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main", "master"]

  # Re-deploy after the archive-push workflows commit new artifacts. Those
  # workflows push with GITHUB_TOKEN, which does NOT fire the `push` trigger
  # above (GitHub's recursion guard). workflow_run fires regardless, so Pages
  # stays in sync with mirrored binaries automatically.
  workflow_run:
    workflows:
      - "Update Standalone Artifacts (API + UI)"
      - "Update Agent Release"
      - "Update Agent Binaries"
      # Bu satır eksikti: Update Install Script de GITHUB_TOKEN ile commit
      # ediyor, yani `push` tetiklenmiyordu ve downloads/agent/latest/install.sh
      # ancak alakasız bir sonraki workflow'la yayına çıkıyordu.
      - "Update Install Script"
    types:
      - completed

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
