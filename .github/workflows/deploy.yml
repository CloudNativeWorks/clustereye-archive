# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main", "master"]

  # Re-deploy after the archive-push workflows commit new artifacts. Those
  # workflows push with GITHUB_TOKEN, which does NOT fire the `push` trigger
  # above (GitHub's recursion guard). workflow_run fires regardless, so Pages
  # stays in sync with mirrored binaries automatically.
  workflow_run:
    workflows:
      - "Update Standalone Artifacts (API + UI)"
      - "Update Agent Release"
      - "Update Agent Binaries"
      # Bu satır eksikti: Update Install Script de GITHUB_TOKEN ile commit
      # ediyor, yani `push` tetiklenmiyordu ve downloads/agent/latest/install.sh
      # ancak alakasız bir sonraki workflow'la yayına çıkıyordu.
      - "Update Install Script"
      - "Update Eye OS"
    types:
      - completed

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # eye/index.json is what ClusterEye OS servers trust for upgrades and
      # component versions. Its API/UI lists are rebuilt here from what is
      # really under downloads/ (the mirror and the prune change those), and
      # the whole file is signed with the ClusterEye release key on every
      # publish — servers verify the signature against the fingerprint they
      # pin and refuse an unsigned or stale-signed index.
      - name: Refresh and sign eye/index.json
        # Never blocks the deploy: the agent, the standalone artifacts and the
        # page must publish whatever happens here. An unsigned or unrefreshed
        # eye/index.json is refused by ClusterEye OS servers (fail-closed), so
        # a failure costs only the OS upgrade feed until it is fixed.
        continue-on-error: true
        env:
          EYE_GPG_PRIVATE_KEY: ${{ secrets.EYE_GPG_PRIVATE_KEY }}
          EYE_GPG_PASSPHRASE: ${{ secrets.EYE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          python3 tools/eye-index.py sync-components
          rm -f eye/index.json.asc
          if [ -z "${EYE_GPG_PRIVATE_KEY}" ]; then
            echo "::warning::EYE_GPG_PRIVATE_KEY is not set: eye/index.json is published UNSIGNED and ClusterEye OS servers will refuse it"
            exit 0
          fi
          export GNUPGHOME; GNUPGHOME=$(mktemp -d); chmod 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$EYE_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$EYE_GPG_PASSPHRASE" \
              --armor --detach-sign --output eye/index.json.asc eye/index.json
          status=$(gpg --batch --status-fd 1 --verify eye/index.json.asc eye/index.json 2>/dev/null || true)
          grep -qE '^\[GNUPG:\] VALIDSIG .* 447CFB9BD464F747866117157E12CCDFEDF9400F$' <<<"$status" \
            || { echo "::error::EYE_GPG_PRIVATE_KEY is not the ClusterEye release key (447CFB9BD464F747866117157E12CCDFEDF9400F)"; exit 1; }
          # The public key is published for convenience; it is never the trust
          # anchor (servers and eye-os's bump pin the fingerprint).
          gpg --armor --export release@clustereye.com > eye/eye-release-signing.asc
          echo "signed eye/index.json ($(sha256sum eye/index.json | cut -c1-16)…)"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
