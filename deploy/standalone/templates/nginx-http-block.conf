# ═══════════════════════════════════════════════
# Plaintext HTTP/h2c server (no TLS)
# Same routing rules as the HTTPS block (shared via include).
# Required for agents/clients that connect over plaintext gRPC.
# ═══════════════════════════════════════════════
server {
    listen ${CE_HTTP_PORT} http2;
    ${CE_LISTEN_V6_HTTP}
    server_name _;

    include /etc/clustereye/nginx-locations.inc;
}
