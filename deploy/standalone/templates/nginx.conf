# /etc/nginx/conf.d/clustereye.conf
# Managed by the ClusterEye standalone installer.
# Substituted variables: CE_PORT, CE_HTTP_PORT, CE_LISTEN_V6_SSL.

# --- gRPC upstream ---
upstream grpc_backend {
    server 127.0.0.1:50051;
    keepalive 64;
    keepalive_requests 1000000;
}

# --- HTTP API upstream ---
upstream api_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# --- Detect CEFE header for API routing ---
map $http_cefe $is_cefe {
    default  0;
    "Yes"    1;
}

# --- Detect gRPC by content-type ---
map $content_type $is_grpc {
    default              0;
    "application/grpc"   1;
    ~^application/grpc   1;
}

# ═══════════════════════════════════════════════
# HTTPS server (TLS terminator)
# ═══════════════════════════════════════════════
server {
    listen ${CE_PORT} ssl http2;
    ${CE_LISTEN_V6_SSL}
    server_name _;

    # --- TLS ---
    ssl_certificate     /etc/clustereye/tls/server.crt;
    ssl_certificate_key /etc/clustereye/tls/server.key;
    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:CE_SSL:10m;
    ssl_session_tickets off;

    # HSTS — only emitted when --http-port=none (TLS-only mode).
    # When a plaintext companion port is enabled, sending HSTS would force
    # browsers to upgrade http://host:plain-port to https://host:plain-port,
    # which has no TLS listener and breaks with "invalid HTTP response".
    ${CE_HSTS_HEADER}

    include /etc/clustereye/nginx-locations.inc;
}
