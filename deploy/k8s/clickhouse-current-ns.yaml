# ClusterEye — single-node ClickHouse for existing Kubernetes deployments.
#
# Namespace-free variant: objects land in whatever namespace kubectl's
# current context points at (or whatever -n you pass). Use this when the
# ClusterEye release was installed into the default namespace.
#
# Mirrors the clustereye-influxdb-0 / clustereye-postgresql-0 pattern:
# one StatefulSet + ClusterIP Service. The initial schema (001_schema.sql
# from clustereye-api) is applied automatically on first start via
# /docker-entrypoint-initdb.d; tables added later are created by the API
# itself on boot (ensureAdditiveSchema, CREATE TABLE IF NOT EXISTS).
#
# Usage: run install-clickhouse.sh — it creates the schema ConfigMap from
# /tmp/001_schema.sql, applies this file and points the API at it.
---
apiVersion: v1
kind: Secret
metadata:
  name: clustereye-clickhouse
type: Opaque
stringData:
  CLICKHOUSE_PASSWORD: "__CLICKHOUSE_PASSWORD__"
---
apiVersion: v1
kind: Service
metadata:
  name: clustereye-clickhouse
spec:
  selector:
    app: clustereye-clickhouse
  ports:
    - name: native
      port: 9000
      targetPort: 9000
    - name: http
      port: 8123
      targetPort: 8123
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clustereye-clickhouse
spec:
  serviceName: clustereye-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clustereye-clickhouse
  template:
    metadata:
      labels:
        app: clustereye-clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          ports:
            - containerPort: 9000
            - containerPort: 8123
          env:
            - name: CLICKHOUSE_DB
              value: clustereye
            - name: CLICKHOUSE_USER
              value: clustereye
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clustereye-clickhouse
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: init-schema
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: init-schema
          configMap:
            name: clustereye-clickhouse-schema
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
